<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024 Game - Colorful Edition</title>
    <style>
        /* Modern, vibrant background */
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #3b8183 0%, #fad089 100%);
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 10px 10px 0px #333; /* Bold retro shadow */
            border: 4px solid #333;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 300px;
            margin-bottom: 20px;
        }

        h1 { 
            margin: 0; 
            font-size: 48px; 
            color: #333; 
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .score-box {
            background: #333;
            padding: 10px 20px;
            color: #fad089;
            border-radius: 8px;
            font-weight: bold;
            border: 2px solid #333;
        }

        .game-board {
            width: 300px;
            height: 300px;
            background: #333; /* Darker board for better contrast */
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
        }

        .tile {
            width: 65px;
            height: 65px;
            background: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 800;
            border-radius: 6px;
            transition: all 0.1s ease-in-out;
            animation: appear 0.2s;
        }

        @keyframes appear {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Distinct, vibrant Tile Styles */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: white; border: 2px solid #d68a4a; }
        .tile-16 { background: #f59563; color: white; }
        .tile-32 { background: #f67c5f; color: white; }
        .tile-64 { background: #f65e3b; color: white; }
        .tile-128 { background: #edcf72; color: white; font-size: 1.3rem; box-shadow: 0 0 10px #edcf72; }
        .tile-256 { background: #edcc61; color: white; font-size: 1.3rem; box-shadow: 0 0 15px #edcc61; }
        .tile-512 { background: #edc850; color: white; font-size: 1.3rem; }
        .tile-1024 { background: #edc53f; color: white; font-size: 1.1rem; }
        .tile-2048 { background: #3b8183; color: #fad089; font-size: 1.1rem; border: 3px solid #fad089; }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            border: 3px solid #333;
            background: #fad089;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            font-size: 18px;
            box-shadow: 4px 4px 0px #333;
            transition: 0.1s;
        }

        button:hover {
            background: #f8c364;
        }

        button:active {
            box-shadow: 0px 0px 0px #333;
            transform: translate(4px, 4px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-box">
                <small style="display:block; font-size: 10px; text-transform: uppercase;">Score</small>
                <span id="score">0</span>
            </div>
        </div>

        <div class="game-board" id="board"></div>

        <button onclick="resetGame()">RESET GAME</button>
    </div>

    <script>
        const boardElement = document.getElementById("board");
        const scoreElement = document.getElementById("score");
        let board = [];
        let score = 0;

        function initGame() {
            board = Array(16).fill(0);
            score = 0;
            scoreElement.innerText = score;
            addRandomTile();
            addRandomTile();
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = "";
            board.forEach((value) => {
                const tile = document.createElement("div");
                tile.className = "tile" + (value ? ` tile-${value}` : "");
                tile.innerText = value === 0 ? "" : value;
                boardElement.appendChild(tile);
            });
        }

        function addRandomTile() {
            const empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (empty.length > 0) {
                board[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function handleMove(direction) {
            let oldBoard = [...board];
            for (let i = 0; i < 4; i++) {
                let row = [];
                if (direction === "LEFT" || direction === "RIGHT") {
                    row = [board[i*4], board[i*4+1], board[i*4+2], board[i*4+3]];
                    if (direction === "RIGHT") row.reverse();
                    let newRow = slide(row);
                    if (direction === "RIGHT") newRow.reverse();
                    for (let j = 0; j < 4; j++) board[i*4+j] = newRow[j];
                } else {
                    row = [board[i], board[i+4], board[i+8], board[i+12]];
                    if (direction === "DOWN") row.reverse();
                    let newRow = slide(row);
                    if (direction === "DOWN") newRow.reverse();
                    for (let j = 0; j < 4; j++) board[i+j*4] = newRow[j];
                }
            }
            if (JSON.stringify(oldBoard) !== JSON.stringify(board)) {
                addRandomTile();
                renderBoard();
                scoreElement.innerText = score;
                checkStatus();
            }
        }

        function slide(row) {
            let arr = row.filter(v => v);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function checkStatus() {
            if (board.includes(2048)) alert("You Win! The Ultimate 2048!");
            else if (!board.includes(0)) {
                let movePossible = false;
                for (let i = 0; i < 16; i++) {
                    if ((i % 4 < 3 && board[i] === board[i+1]) || (i < 12 && board[i] === board[i+4])) movePossible = true;
                }
                if (!movePossible) alert("Game Over! Try again.");
            }
        }

        function resetGame() { initGame(); }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") handleMove("UP");
            if (e.key === "ArrowDown" || e.key === "s") handleMove("DOWN");
            if (e.key === "ArrowLeft" || e.key === "a") handleMove("LEFT");
            if (e.key === "ArrowRight" || e.key === "d") handleMove("RIGHT");
        });

        initGame();
    </script>
</body>
</html>
