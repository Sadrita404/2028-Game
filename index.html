<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 Game - Hack Club</title>
    <style>
      @property --a {
        syntax: "<angle>";
        inherits: true;
        initial-value: 0deg;
      }
      @property --p {
        syntax: "<percentage>";
        inherits: true;
        initial-value: 0%;
      }
      @property --c1 {
        syntax: "<color>";
        inherits: true;
        initial-value: #000;
      }
      @property --c2 {
        syntax: "<color>";
        inherits: true;
        initial-value: #000;
      }

      html {
        --s: 80px;
        --_g: #0000, var(--c1) 2deg calc(var(--a) - 2deg), #0000 var(--a);
        background: conic-gradient(
            from calc(-45deg - var(--a) / 2) at top var(--p) left var(--p),
            var(--_g)
          ),
          conic-gradient(
            from calc(-45deg - var(--a) / 2) at top var(--p) left var(--p),
            var(--_g)
          ),
          conic-gradient(
            from calc(45deg - var(--a) / 2) at top var(--p) right var(--p),
            var(--_g)
          ),
          conic-gradient(
            from calc(45deg - var(--a) / 2) at top var(--p) right var(--p),
            var(--_g)
          ),
          conic-gradient(
            from calc(-135deg - var(--a) / 2) at bottom var(--p) left var(--p),
            var(--_g)
          ),
          conic-gradient(
            from calc(-135deg - var(--a) / 2) at bottom var(--p) left var(--p),
            var(--_g)
          ),
          conic-gradient(
            from calc(135deg - var(--a) / 2) at bottom var(--p) right var(--p),
            var(--_g)
          ),
          conic-gradient(
              from calc(135deg - var(--a) / 2) at bottom var(--p) right var(--p),
              var(--_g)
            )
            var(--c2);
        background-size: calc(2 * var(--s)) calc(2 * var(--s));
        animation: m 2s infinite alternate linear;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
      }

      @keyframes m {
        0%,
        15% {
          --a: 135deg;
          --p: 20%;
          --c1: #3b8183;
          --c2: #fad089;
          background-position: 0 0, var(--s) var(--s);
        }
        45%,
        50% {
          --a: 90deg;
          --p: 25%;
          --c1: #3b8183;
          --c2: #fad089;
          background-position: 0 0, var(--s) var(--s);
        }
        50.01%,
        55% {
          --a: 90deg;
          --p: 25%;
          --c2: #3b8183;
          --c1: #fad089;
          background-position: var(--s) 0, 0 var(--s);
        }
        85%,
        100% {
          --a: 135deg;
          --p: 20%;
          --c2: #3b8183;
          --c1: #fad089;
          background-position: var(--s) 0, 0 var(--s);
        }
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        color: #333;
        position: relative;
      }

      .hc-logo {
        position: absolute;
        top: 0;
        left: 10px;
        width: 220px;
        z-index: 999;
        border: 0;
      }

      .container {
        background: #ffffff;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 8px 8px 0px #333;
        text-align: center;
        max-width: 350px;
        border: 4px solid #333;
        z-index: 10;
      }

      header h1 {
        margin: 0;
        font-size: 1.8rem;
        text-transform: uppercase;
      }

      .score-container {
        display: flex;
        justify-content: space-around;
        margin: 10px 0;
      }

      .score-box {
        background: #eee;
        padding: 5px 15px;
        border: 2px solid #333;
        font-weight: bold;
        font-size: 0.9rem;
      }

      .game-board {
        width: 260px;
        height: 260px;
        background: #bbada0;
        border: 6px solid #333;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 8px;
        padding: 8px;
        margin: 0 auto;
        position: relative;
      }

      .tile {
        width: 100%;
        height: 100%;
        background: #eee;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.2rem;
        font-weight: bold;
        border: 2px solid #333;
        transition: transform 0.1s;
      }

      .tile-2 { background: #eee4da; }
      .tile-4 { background: #ede0c8; }
      .tile-8 { background: #f2b179; color: white; }
      .tile-16 { background: #f59563; color: white; }
      .tile-32 { background: #f67c5f; color: white; }
      .tile-64 { background: #f65e3b; color: white; }
      .tile-128 { background: #edcf72; color: white; }
      .tile-256 { background: #edcc61; color: white; }
      .tile-512 { background: #edc850; color: white; }
      .tile-1024 { background: #edc53f; color: white; }
      .tile-2048 { background: #edc22e; color: white; }

      .controls {
        margin-top: 15px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      button {
        padding: 8px 15px;
        font-size: 0.9rem;
        cursor: pointer;
        border: 3px solid #333;
        background: #fad089;
        font-weight: bold;
        box-shadow: 4px 4px 0px #333;
        transition: 0.1s;
      }

      button:active {
        box-shadow: 0px 0px 0px #333;
        transform: translate(4px, 4px);
      }

      footer {
        margin-top: 20px;
        padding: 10px 20px;
        background: #fff;
        border: 3px solid #333;
        font-weight: bold;
        font-size: 0.9rem;
        z-index: 10;
      }

      .instructions {
        font-size: 0.75rem;
        margin-top: 10px;
        text-align: left;
        background: #f9f9f9;
        padding: 8px;
        border: 2px solid #333;
      }
    </style>
  </head>
  <body>
    <a href="https://hackclub.com/" class="hc-logo">
      <img src="https://assets.hackclub.com/flag-orpheus-top.svg" />
    </a>

    <div class="container">
      <header><h1>2048 Game</h1></header>

      <div class="score-container">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="score-box">Best: <span id="best">0</span></div>
      </div>

      <div class="game-board" id="board"></div>

      <div class="controls">
        <button id="music-toggle">Music: OFF</button>
        <button onclick="resetGame()">Restart (R)</button>
      </div>

      <div class="instructions">
        <strong>How To Play:</strong> Use arrows or WSAD. Colliding same values merge and double. Reach the limit to win!
      </div>
    </div>

    <footer>By Sadrita Neogi ( Hack Club )</footer>

    <audio id="bg-music" loop src="songbg.mp3"></audio>
    <audio id="move-sound" src="button.mp3"></audio>

    <script>
      const boardElement = document.getElementById("board");
      const scoreElement = document.getElementById("score");
      const bestElement = document.getElementById("best");
      const musicBtn = document.getElementById("music-toggle");
      const bgMusic = document.getElementById("bg-music");
      const moveSound = document.getElementById("move-sound");

      let board = [];
      let score = 0;
      let bestScore = localStorage.getItem("2048best") || 0;
      let musicOn = false;
      bestElement.innerText = bestScore;

      function initGame() {
        board = Array(16).fill(0);
        score = 0;
        updateScore();
        addRandomTile();
        addRandomTile();
        renderBoard();
      }

      function renderBoard() {
        boardElement.innerHTML = "";
        board.forEach((value) => {
          const tile = document.createElement("div");
          tile.className = "tile" + (value ? ` tile-${value}` : "");
          tile.innerText = value === 0 ? "" : value;
          boardElement.appendChild(tile);
        });
      }

      function addRandomTile() {
        const emptyTiles = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
        if (emptyTiles.length > 0) {
          const randomIdx = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
          board[randomIdx] = Math.random() < 0.9 ? 2 : 4;
        }
      }

      function updateScore() {
        scoreElement.innerText = score;
        if (score > bestScore) {
          bestScore = score;
          bestElement.innerText = bestScore;
          localStorage.setItem("2048best", bestScore);
        }
      }

      function playMoveSound() {
        moveSound.currentTime = 0;
        moveSound.play().catch(() => {});
      }

      function slide(row) {
        let arr = row.filter(val => val);
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            score += arr[i];
            arr.splice(i + 1, 1);
          }
        }
        while (arr.length < 4) arr.push(0);
        return arr;
      }

      function handleMove(direction) {
        let oldBoard = [...board];

        for (let i = 0; i < 4; i++) {
          let row = [];
          if (direction === "LEFT" || direction === "RIGHT") {
            row = [board[i*4], board[i*4+1], board[i*4+2], board[i*4+3]];
            if (direction === "RIGHT") row.reverse();
            let newRow = slide(row);
            if (direction === "RIGHT") newRow.reverse();
            for (let j = 0; j < 4; j++) board[i*4+j] = newRow[j];
          } else {
            row = [board[i], board[i+4], board[i+8], board[i+12]];
            if (direction === "DOWN") row.reverse();
            let newRow = slide(row);
            if (direction === "DOWN") newRow.reverse();
            for (let j = 0; j < 4; j++) board[i+j*4] = newRow[j];
          }
        }

        if (JSON.stringify(oldBoard) !== JSON.stringify(board)) {
          playMoveSound();
          addRandomTile();
          renderBoard();
          updateScore();
          checkGameOver();
        }
      }

      function checkGameOver() {
        if (board.includes(2048)) {
          alert("You created the 2048 tile! You Win!");
          resetGame();
        } else if (!board.includes(0)) {
          let canMove = false;
          for (let i = 0; i < 16; i++) {
            if ((i % 4 < 3 && board[i] === board[i + 1]) || (i < 12 && board[i] === board[i + 4])) {
              canMove = true;
              break;
            }
          }
          if (!canMove) alert("Game Over! No more moves.");
        }
      }

      function resetGame() {
        initGame();
      }

      window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if (["arrowup","w"].includes(key)) handleMove("UP");
        if (["arrowdown","s"].includes(key)) handleMove("DOWN");
        if (["arrowleft","a"].includes(key)) handleMove("LEFT");
        if (["arrowright","d"].includes(key)) handleMove("RIGHT");
        if (key === "r") resetGame();
      });

      musicBtn.addEventListener("click", () => {
        musicOn = !musicOn;
        if (musicOn) {
          bgMusic.play().catch(() => {});
          musicBtn.innerText = "Music: ON";
        } else {
          bgMusic.pause();
          musicBtn.innerText = "Music: OFF";
        }
      });

      let touchStartX = 0;
      let touchStartY = 0;

      boardElement.addEventListener("touchstart", e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      boardElement.addEventListener("touchend", e => {
        let diffX = e.changedTouches[0].screenX - touchStartX;
        let diffY = e.changedTouches[0].screenY - touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
          if (Math.abs(diffX) > 30) diffX > 0 ? handleMove("RIGHT") : handleMove("LEFT");
        } else {
          if (Math.abs(diffY) > 30) diffY > 0 ? handleMove("DOWN") : handleMove("UP");
        }
      }, { passive: true });

      initGame();
    </script>
  </body>
</html>
