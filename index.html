<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024 Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #faf8ef;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 280px;
            margin-bottom: 10px;
        }

        h1 { margin: 0; font-size: 40px; color: #776e65; }

        .score-box {
            background: #bbada0;
            padding: 5px 15px;
            color: white;
            border-radius: 3px;
            font-weight: bold;
        }

        .game-board {
            width: 280px;
            height: 280px;
            background: #bbada0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            border-radius: 6px;
        }

        .tile {
            width: 60px;
            height: 60px;
            background: rgba(238, 228, 218, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 3px;
            color: #776e65;
        }

        /* Tile Styles */
        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 1.2rem; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 1.2rem; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 1.2rem; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1rem; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1rem; }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #8f7a66;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-box">Score: <span id="score">0</span></div>
        </div>

        <div class="game-board" id="board"></div>

        <button onclick="resetGame()">New Game</button>
    </div>

    <script>
        const boardElement = document.getElementById("board");
        const scoreElement = document.getElementById("score");
        let board = [];
        let score = 0;

        function initGame() {
            board = Array(16).fill(0);
            score = 0;
            scoreElement.innerText = score;
            addRandomTile();
            addRandomTile();
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = "";
            board.forEach((value) => {
                const tile = document.createElement("div");
                tile.className = "tile" + (value ? ` tile-${value}` : "");
                tile.innerText = value === 0 ? "" : value;
                boardElement.appendChild(tile);
            });
        }

        function addRandomTile() {
            const empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (empty.length > 0) {
                board[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function handleMove(direction) {
            let oldBoard = [...board];
            for (let i = 0; i < 4; i++) {
                let row = [];
                if (direction === "LEFT" || direction === "RIGHT") {
                    row = [board[i*4], board[i*4+1], board[i*4+2], board[i*4+3]];
                    if (direction === "RIGHT") row.reverse();
                    let newRow = slide(row);
                    if (direction === "RIGHT") newRow.reverse();
                    for (let j = 0; j < 4; j++) board[i*4+j] = newRow[j];
                } else {
                    row = [board[i], board[i+4], board[i+8], board[i+12]];
                    if (direction === "DOWN") row.reverse();
                    let newRow = slide(row);
                    if (direction === "DOWN") newRow.reverse();
                    for (let j = 0; j < 4; j++) board[i+j*4] = newRow[j];
                }
            }
            if (JSON.stringify(oldBoard) !== JSON.stringify(board)) {
                addRandomTile();
                renderBoard();
                scoreElement.innerText = score;
                checkStatus();
            }
        }

        function slide(row) {
            let arr = row.filter(v => v);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function checkStatus() {
            if (board.includes(2048)) alert("You Win!");
            else if (!board.includes(0)) {
                let movePossible = false;
                for (let i = 0; i < 16; i++) {
                    if ((i % 4 < 3 && board[i] === board[i+1]) || (i < 12 && board[i] === board[i+4])) movePossible = true;
                }
                if (!movePossible) alert("Game Over");
            }
        }

        function resetGame() { initGame(); }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") handleMove("UP");
            if (e.key === "ArrowDown" || e.key === "s") handleMove("DOWN");
            if (e.key === "ArrowLeft" || e.key === "a") handleMove("LEFT");
            if (e.key === "ArrowRight" || e.key === "d") handleMove("RIGHT");
        });

        initGame();
    </script>
</body>
</html>
