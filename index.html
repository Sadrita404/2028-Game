<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Layout</title>
    <style>
        /* Basic reset and positioning */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* The main wrapper */
        .game-container {
            width: 320px;
        }

        /* Header area for Title and Score */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .score-box {
            border: 1px solid #000;
            padding: 10px;
        }

        /* The 4x4 Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            background-color: #ccc;
            padding: 10px;
        }

        /* Individual slots */
        .cell {
            width: 65px;
            height: 65px;
            background-color: #fff;
            border: 1px solid #999;
        }

        /* Footer for the button */
        .footer {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-box">Score: 0</div>
        </div>

        <div class="grid">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>

        <div class="footer">
            <button>New Game</button>
        </div>
    </div>

</body>
</html>
