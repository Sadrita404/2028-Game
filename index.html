<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic 2048</title>
    <style>
        /* Minimal styling just to make the grid look like a grid */
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #ffffff;
            color: #000000;
        }

        .board {
            display: inline-grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 5px;
            background-color: #bbada0;
            padding: 5px;
            border: 2px solid #000;
        }

        .tile {
            width: 80px;
            height: 80px;
            background-color: #eee4da;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border: 1px solid #776e65;
        }

        /* Essential color logic so you can actually play */
        .tile-2 { background-color: #eee4da; }
        .tile-4 { background-color: #ede0c8; }
        .tile-8 { background-color: #f2b179; color: #fff; }
        .tile-16 { background-color: #f59563; color: #fff; }
        .tile-32 { background-color: #f67c5f; color: #fff; }
        .tile-64 { background-color: #f65e3b; color: #fff; }
        .tile-128 { background-color: #edcf72; color: #fff; }
        .tile-256 { background-color: #edcc61; color: #fff; }
        .tile-512 { background-color: #edc850; color: #fff; }
        .tile-1024 { background-color: #edc53f; color: #fff; }
        .tile-2048 { background-color: #edc22e; color: #fff; }

        .controls {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>2048 Game</h1>
    
    <p>Score: <b id="score">0</b></p>

    <div class="board" id="board">
        </div>

    <div class="controls">
        <button onclick="resetGame()">Restart Game</button>
        <p><small>Use Arrow Keys or WASD to move</small></p>
    </div>

    <script>
        const boardElement = document.getElementById("board");
        const scoreElement = document.getElementById("score");
        let board = [];
        let score = 0;

        function initGame() {
            board = Array(16).fill(0);
            score = 0;
            scoreElement.innerText = score;
            addRandomTile();
            addRandomTile();
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = "";
            board.forEach((value) => {
                const tile = document.createElement("div");
                tile.className = "tile" + (value ? ` tile-${value}` : "");
                tile.innerText = value === 0 ? "" : value;
                boardElement.appendChild(tile);
            });
        }

        function addRandomTile() {
            const empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if (empty.length > 0) {
                board[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function handleMove(direction) {
            let oldBoard = JSON.stringify(board);
            for (let i = 0; i < 4; i++) {
                let row = [];
                if (direction === "LEFT" || direction === "RIGHT") {
                    row = [board[i*4], board[i*4+1], board[i*4+2], board[i*4+3]];
                    if (direction === "RIGHT") row.reverse();
                    let newRow = slide(row);
                    if (direction === "RIGHT") newRow.reverse();
                    for (let j = 0; j < 4; j++) board[i*4+j] = newRow[j];
                } else {
                    row = [board[i], board[i+4], board[i+8], board[i+12]];
                    if (direction === "DOWN") row.reverse();
                    let newRow = slide(row);
                    if (direction === "DOWN") newRow.reverse();
                    for (let j = 0; j < 4; j++) board[i+j*4] = newRow[j];
                }
            }
            if (oldBoard !== JSON.stringify(board)) {
                addRandomTile();
                renderBoard();
                scoreElement.innerText = score;
                checkStatus();
            }
        }

        function slide(row) {
            let arr = row.filter(v => v);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function checkStatus() {
            if (board.includes(2048)) alert("You Won!");
            else if (!board.includes(0)) {
                let movePossible = false;
                for (let i = 0; i < 16; i++) {
                    if ((i % 4 < 3 && board[i] === board[i+1]) || (i < 12 && board[i] === board[i+4])) movePossible = true;
                }
                if (!movePossible) alert("Game Over");
            }
        }

        function resetGame() { initGame(); }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") handleMove("UP");
            if (e.key === "ArrowDown" || e.key === "s") handleMove("DOWN");
            if (e.key === "ArrowLeft" || e.key === "a") handleMove("LEFT");
            if (e.key === "ArrowRight" || e.key === "d") handleMove("RIGHT");
        });

        initGame();
    </script>
</body>
</html>
